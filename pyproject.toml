[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "seedance-mcp"
version = "0.1.0"
description = "Seedance video and Seedream images in Claude and any MCP client, with a spend guard that asks before it burns your money."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "atharva3vedi" }]
requires-python = ">=3.10"
keywords = ["mcp", "seedance", "seedream", "byteplus", "modelark", "ai-video", "claude"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "mcp>=1.25,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/atharva3vedi/seedance-mcp"
Issues = "https://github.com/atharva3vedi/seedance-mcp/issues"

[project.scripts]
seedance-mcp = "seedance_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/seedance_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
