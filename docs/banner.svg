<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="seedance-mcp: Seedance video and Seedream images in Claude, with a spend guard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070D"/>
      <stop offset="1" stop-color="#140B2B"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F97316" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDBA74"/>
      <stop offset="0.55" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="dusk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9D5FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <circle cx="930" cy="150" r="300" fill="url(#glowA)"/>
  <circle cx="1130" cy="360" r="220" fill="url(#glowB)"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="104" fill="#C4B5FD" font-size="15" font-weight="700" letter-spacing="4">MCP SERVER</text>
    <text x="70" y="182" fill="url(#title)" font-size="78" font-weight="800" letter-spacing="-2">seedance-mcp</text>
    <text x="72" y="232" fill="#FFFFFF" font-size="25" font-weight="500">Seedance video and Seedream images in Claude.</text>
    <text x="72" y="266" fill="#FFFFFF" font-size="25" font-weight="500" opacity="0.9">Your own BytePlus key. No markup. No surprise bills.</text>

    <rect x="72" y="296" width="372" height="44" rx="22" fill="#052E1B" stroke="#22C55E" stroke-opacity="0.7"/>
    <circle cx="98" cy="318" r="6" fill="#4ADE80"/>
    <text x="116" y="324" fill="#BBF7D0" font-size="17" font-weight="600">Spend guard: asks before it spends</text>
  </g>

  <!-- film strip -->
  <g transform="translate(742 70) rotate(-7)" filter="url(#shadow)">
    <rect x="0" y="0" width="402" height="214" rx="14" fill="#0B0B12" stroke="#2E2A45"/>
    <g fill="#26213D">
      <rect x="18" y="12" width="20" height="12" rx="3"/><rect x="58" y="12" width="20" height="12" rx="3"/>
      <rect x="98" y="12" width="20" height="12" rx="3"/><rect x="138" y="12" width="20" height="12" rx="3"/>
      <rect x="178" y="12" width="20" height="12" rx="3"/><rect x="218" y="12" width="20" height="12" rx="3"/>
      <rect x="258" y="12" width="20" height="12" rx="3"/><rect x="298" y="12" width="20" height="12" rx="3"/>
      <rect x="338" y="12" width="20" height="12" rx="3"/><rect x="378" y="12" width="12" height="12" rx="3"/>
      <rect x="18" y="190" width="20" height="12" rx="3"/><rect x="58" y="190" width="20" height="12" rx="3"/>
      <rect x="98" y="190" width="20" height="12" rx="3"/><rect x="138" y="190" width="20" height="12" rx="3"/>
      <rect x="178" y="190" width="20" height="12" rx="3"/><rect x="218" y="190" width="20" height="12" rx="3"/>
      <rect x="258" y="190" width="20" height="12" rx="3"/><rect x="298" y="190" width="20" height="12" rx="3"/>
      <rect x="338" y="190" width="20" height="12" rx="3"/><rect x="378" y="190" width="12" height="12" rx="3"/>
    </g>
    <rect x="16" y="36" width="118" height="142" rx="8" fill="url(#sunset)"/>
    <circle cx="75" cy="112" r="22" fill="#FEF3C7" opacity="0.9"/>
    <path d="M16 150 Q 45 136 75 148 T 134 146 V 178 H 16 Z" fill="#3B0764" opacity="0.75"/>
    <rect x="142" y="36" width="118" height="142" rx="8" fill="url(#ocean)"/>
    <path d="M142 128 Q 172 112 201 126 T 260 122 V 178 H 142 Z" fill="#E0F2FE" opacity="0.55"/>
    <path d="M142 146 Q 172 132 201 144 T 260 140 V 178 H 142 Z" fill="#1E3A8A" opacity="0.8"/>
    <rect x="268" y="36" width="118" height="142" rx="8" fill="url(#dusk)"/>
    <path d="M268 178 L 302 112 L 328 146 L 350 118 L 386 178 Z" fill="#1E1B4B" opacity="0.85"/>
    <circle cx="358" cy="70" r="10" fill="#FDE68A" opacity="0.9"/>
  </g>

  <!-- approval card -->
  <g transform="translate(832 236)" filter="url(#shadow)" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="300" height="118" rx="16" fill="#FFFFFF"/>
    <text x="22" y="36" fill="#6D28D9" font-size="13" font-weight="700" letter-spacing="1.5">SPEND ABOUT</text>
    <text x="22" y="80" fill="#0B0B12" font-size="42" font-weight="800" letter-spacing="-1">$1.17</text>
    <text x="22" y="104" fill="#3F3A55" font-size="14" font-weight="600">Seedance 2.5, 5s, 720p</text>
    <rect x="186" y="46" width="94" height="32" rx="16" fill="#16A34A"/>
    <text x="233" y="67" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">Approve</text>
    <rect x="186" y="84" width="94" height="26" rx="13" fill="none" stroke="#C7C2D6"/>
    <text x="233" y="102" fill="#3F3A55" font-size="13" font-weight="600" text-anchor="middle">Decline</text>
  </g>
</svg>
